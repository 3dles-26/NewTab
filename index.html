<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>검색바</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: 왼쪽 정렬의 단일 컬럼. 검색창 한 줄 + 엔진 메뉴. 선택한 엔진 색이 포커스 링과 버튼에 반영된다. */
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --fg: #14171f;
    --muted: #596071;
    --line: #d6dbe4;
    --engine: #1a63d8;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218;
      --surface: #171b23;
      --fg: #eceff5;
      --muted: #97a0b0;
      --line: #2a303c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218;
    --surface: #171b23;
    --fg: #eceff5;
    --muted: #97a0b0;
    --line: #2a303c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: clamp(72px, 14vh, 140px) 48px;
  }
  .wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 1.9rem); font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }

  .bar {
    position: relative;
    display: flex;
    align-items: stretch;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  .bar:focus-within {
    border-color: var(--engine);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--engine) 24%, transparent);
  }

  .engine-btn {
    display: flex; align-items: center; gap: 8px;
    flex: 0 0 auto;
    padding: 0 12px 0 16px;
    background: none; border: 0; border-right: 1px solid var(--line);
    border-radius: 13px 0 0 13px;
    color: var(--fg); font: 500 0.95rem var(--font-body);
    cursor: pointer;
  }
  .engine-btn:hover { background: color-mix(in srgb, var(--fg) 5%, transparent); }
  .engine-btn:focus-visible, .go:focus-visible, .opt:focus-visible { outline: 2px solid var(--engine); outline-offset: -2px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--engine)); flex: 0 0 auto; }
  .chev { width: 12px; height: 12px; color: var(--muted); transition: transform .15s; }
  .engine-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

  #q {
    flex: 1 1 auto; min-width: 0;
    padding: 16px 14px;
    background: none; border: 0; outline: 0;
    color: var(--fg); font: 400 1rem var(--font-body);
  }
  #q::placeholder { color: var(--muted); }

  .go {
    flex: 0 0 auto;
    margin: 6px;
    padding: 0 18px;
    background: var(--engine); color: #fff;
    border: 0; border-radius: 9px;
    font: 600 0.95rem var(--font-body);
    cursor: pointer;
    transition: background .15s, filter .15s;
  }
  .go:hover { filter: brightness(1.08); }

  .menu {
    position: absolute; z-index: 5;
    top: calc(100% + 8px); left: 0;
    width: min(260px, 100%);
    margin: 0; padding: 6px; list-style: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 12px 32px color-mix(in srgb, #000 16%, transparent);
  }
  .opt {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 8px;
    cursor: pointer;
  }
  .opt:hover, .opt:focus { background: color-mix(in srgb, var(--fg) 7%, transparent); outline: none; }
  .opt:focus-visible { outline: 2px solid var(--engine); outline-offset: -2px; }
  .opt .host { margin-left: auto; font: 400 0.75rem var(--font-mono); color: var(--muted); }
  .opt[aria-selected="true"] { font-weight: 600; }
  .check { width: 14px; height: 14px; margin-left: 2px; visibility: hidden; color: var(--engine); }
  .opt[aria-selected="true"] .check { visibility: visible; }

  .sc-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; padding: 9px 12px;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px;
    font: 500 0.9rem var(--font-body);
    cursor: pointer;
  }
  .sc-toggle:hover { border-color: var(--muted); }
  .sc-toggle:focus-visible { outline: 2px solid var(--engine); outline-offset: 1px; }
  .sc-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .sc-list { display: flex; flex-direction: column; gap: 10px; padding: 12px 2px 0; }
  .sc-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.9rem; }
  .sc-row .key-btn { flex: 0 0 auto; min-width: 72px; padding: 6px 10px; }
  .key-static {
    min-width: 72px; padding: 6px 10px; text-align: center;
    border: 1px solid var(--line); border-radius: 10px;
    font: 400 0.9rem var(--font-mono); color: var(--muted);
  }
  .sc-list .key-reset { align-self: flex-start; }
  .key-btn {
    flex: 1 1 auto; min-width: 0;
    padding: 8px 10px; text-align: center;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px;
    font: 500 0.9rem var(--font-mono);
    cursor: pointer;
  }
  .key-btn:hover { border-color: var(--muted); }
  .key-btn[data-capturing="true"] { border-color: var(--engine); color: var(--muted); }
  .key-btn:focus-visible, .key-reset:focus-visible { outline: 2px solid var(--engine); outline-offset: 1px; }
  .key-reset {
    flex: 0 0 auto; padding: 8px 10px;
    background: none; color: var(--muted);
    border: 1px solid var(--line); border-radius: 10px;
    font: 400 0.85rem var(--font-body);
    cursor: pointer;
  }
  .key-reset:hover { color: var(--fg); }

  .settings {
    position: fixed; z-index: 20;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: max(16px, env(safe-area-inset-right, 0px));
  }
  .set-btn {
    display: grid; place-items: center;
    width: 40px; height: 40px;
    background: var(--surface); color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px;
    cursor: pointer;
  }
  .set-btn:hover { background: color-mix(in srgb, var(--fg) 6%, var(--surface)); }
  .set-btn:focus-visible { outline: 2px solid var(--engine); outline-offset: 2px; }
  .set-btn[aria-expanded="true"] { border-color: var(--engine); }
  .panel {
    position: absolute; top: calc(100% + 8px); right: 0;
    width: min(280px, calc(100vw - 32px));
    display: flex; flex-direction: column; gap: 16px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 32px color-mix(in srgb, #000 16%, transparent);
  }
  .panel fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
  .panel legend { padding: 0; margin-bottom: 6px; font: 400 0.75rem var(--font-mono); color: var(--muted); }
  .seg {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    padding: 4px;
    background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .seg label { position: relative; min-width: 0; }
  .seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .seg span {
    display: block; padding: 7px 8px; text-align: center;
    border-radius: 7px; font-size: 0.9rem; color: var(--muted);
  }
  .seg input:checked + span { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
  .seg input:focus-visible + span { outline: 2px solid var(--engine); outline-offset: 1px; }

  .shortcuts {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 14px 6px;
    margin-top: 8px;
  }
  .tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    min-width: 0; padding: 8px 4px;
    background: none; border: 0; border-radius: 12px;
    color: var(--fg); font: inherit; text-decoration: none;
    cursor: pointer;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  .tile:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .tile:focus-visible { outline: 2px solid var(--engine); outline-offset: 2px; }
  .ico {
    position: relative; overflow: hidden;
    display: grid; place-items: center;
    width: 52px; height: 52px;
    background: var(--c, var(--muted)); color: #fff;
    border: 1px solid var(--line); border-radius: 14px;
    font: 600 1.25rem var(--font-body);
  }
  .ico img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; padding: 11px;
    object-fit: contain;
    background: var(--surface);
  }
  .tile .name {
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 0.8rem; line-height: 1.3; text-align: center; color: var(--muted);
  }
  .tile.add .ico { background: none; border: 1.5px dashed var(--line); color: var(--muted); }

  .scrim {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: center;
    padding: 16px;
    background: color-mix(in srgb, #000 50%, transparent);
  }
  .dlg {
    display: flex; flex-direction: column; gap: 14px;
    width: min(380px, 100%); max-height: 100%; overflow: auto;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 16px 40px color-mix(in srgb, #000 28%, transparent);
  }
  .dlg h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 6px; font: 400 0.75rem var(--font-mono); color: var(--muted); }
  .field input {
    padding: 10px 12px;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px;
    font: 400 1rem var(--font-body);
    outline: 0;
  }
  .field input:focus { border-color: var(--engine); box-shadow: 0 0 0 3px color-mix(in srgb, var(--engine) 24%, transparent); }
  .err { margin: 0; font-size: 0.85rem; color: color-mix(in srgb, #d32f2f 65%, var(--fg)); }
  .dlg-actions { display: flex; align-items: center; gap: 8px; }
  .dlg-actions .spacer { flex: 1; }
  .btn {
    padding: 9px 14px;
    background: none; color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px;
    font: 500 0.9rem var(--font-body);
    cursor: pointer;
  }
  .btn:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .btn:focus-visible { outline: 2px solid var(--engine); outline-offset: 2px; }
  .btn.primary { background: var(--engine); border-color: transparent; color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: color-mix(in srgb, #d32f2f 65%, var(--fg)); }

  @media (max-width: 480px) {
    .engine-btn { padding-left: 12px; }
    .go { padding: 0 14px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="settings" id="settings">
  <button type="button" class="set-btn" id="setBtn" aria-haspopup="true" aria-expanded="false" aria-controls="setPanel" aria-label="설정">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <div class="panel" id="setPanel" role="group" aria-label="설정" hidden>
    <fieldset>
      <legend>화면 모드</legend>
      <div class="seg">
        <label><input type="radio" name="theme" value="light"><span>화이트</span></label>
        <label><input type="radio" name="theme" value="dark"><span>다크</span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend>검색 결과 열기</legend>
      <div class="seg">
        <label><input type="radio" name="open" value="new"><span>새 탭</span></label>
        <label><input type="radio" name="open" value="same"><span>기존 탭</span></label>
      </div>
    </fieldset>
    <div class="sc">
      <button type="button" class="sc-toggle" id="scToggle" aria-expanded="false" aria-controls="scList">
        <span>단축키</span>
        <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
      </button>
      <div class="sc-list" id="scList" hidden>
        <div class="sc-row"><span>검색창으로 이동</span><button type="button" class="key-btn" id="keyBtn" aria-label="검색창으로 이동 단축키 변경">/</button></div>
        <div class="sc-row"><span>검색</span><span class="key-static">Enter</span></div>
        <button type="button" class="key-reset" id="keyReset">초기화</button>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <form class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" autocomplete="off" novalidate>
    <h2 id="dlgTitle">바로가기 추가</h2>
    <label class="field" for="scName">이름<input id="scName" type="text" maxlength="40" placeholder="예: 쿠팡"></label>
    <label class="field" for="scUrl">주소<input id="scUrl" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="example.com"></label>
    <p class="err" id="scErr" role="alert" hidden>주소를 확인해 주세요. 예: example.com</p>
    <div class="dlg-actions">
      <button type="button" class="btn danger" id="scDelete" hidden>삭제</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="scCancel">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</div>

<main class="wrap">
  <h1>무엇을 찾으세요?</h1>

  <form class="bar" id="form" role="search" autocomplete="off">
    <button type="button" class="engine-btn" id="engineBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="menu" aria-label="검색엔진 선택">
      <span class="dot" id="engineDot"></span>
      <span id="engineName">Google</span>
      <svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
    </button>
    <input id="q" name="q" type="search" placeholder="검색어를 입력하세요" aria-label="검색어" enterkeyhint="search">
    <button type="submit" class="go">검색</button>
    <ul class="menu" id="menu" role="listbox" aria-label="검색엔진" hidden></ul>
  </form>

  <section class="shortcuts" id="shortcuts" aria-label="바로가기"></section>

</main>

<script>
(function () {
  var KEY = "searchbar.engine";
  var engines = [
    { id: "google",  name: "Google",     url: "https://www.google.com/search?q=",              host: "google.com",     color: "#1a63d8" },
    { id: "naver",   name: "네이버",      url: "https://search.naver.com/search.naver?query=",  host: "naver.com",      color: "#03893f" },
    { id: "daum",    name: "다음",        url: "https://search.daum.net/search?q=",             host: "daum.net",       color: "#2b6ad0" },
    { id: "bing",    name: "Bing",       url: "https://www.bing.com/search?q=",                host: "bing.com",       color: "#00789a" },
    { id: "ddg",     name: "DuckDuckGo", url: "https://duckduckgo.com/?q=",                    host: "duckduckgo.com", color: "#d4501a" },
    { id: "youtube", name: "YouTube",    url: "https://www.youtube.com/results?search_query=", host: "youtube.com",    color: "#cc1f1f" }
  ];

  var form = document.getElementById("form");
  var q = document.getElementById("q");
  var btn = document.getElementById("engineBtn");
  var nameEl = document.getElementById("engineName");
  var dotEl = document.getElementById("engineDot");
  var menu = document.getElementById("menu");
  var current = engines[0];

  function find(id) {
    for (var i = 0; i < engines.length; i++) if (engines[i].id === id) return engines[i];
    return null;
  }

  function save(id) {
    try { localStorage.setItem(KEY, id); return true; } catch (e) { return false; }
  }
  function load() {
    try { return find(localStorage.getItem(KEY)); } catch (e) { return null; }
  }

  function apply(engine) {
    current = engine;
    nameEl.textContent = engine.name;
    dotEl.style.setProperty("--c", engine.color);
    document.documentElement.style.setProperty("--engine", engine.color);
    q.placeholder = engine.name + "에서 검색";
    var opts = menu.children;
    for (var i = 0; i < opts.length; i++) {
      opts[i].setAttribute("aria-selected", opts[i].dataset.id === engine.id ? "true" : "false");
    }
  }

  function buildMenu() {
    engines.forEach(function (e) {
      var li = document.createElement("li");
      li.className = "opt";
      li.setAttribute("role", "option");
      li.tabIndex = -1;
      li.dataset.id = e.id;
      li.innerHTML =
        '<span class="dot" style="--c:' + e.color + '"></span>' +
        '<span>' + e.name + '</span>' +
        '<span class="host">' + e.host + '</span>' +
        '<svg class="check" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 7.5 3 3 6-7"/></svg>';
      menu.appendChild(li);
    });
  }

  function openMenu() {
    menu.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    var sel = menu.querySelector('[aria-selected="true"]') || menu.firstElementChild;
    sel.focus();
  }
  function closeMenu(returnFocus) {
    menu.hidden = true;
    btn.setAttribute("aria-expanded", "false");
    if (returnFocus) btn.focus();
  }

  function choose(id) {
    var e = find(id);
    if (!e) return;
    apply(e);
    save(e.id);
    closeMenu(false);
    q.focus();
  }

  btn.addEventListener("click", function () { menu.hidden ? openMenu() : closeMenu(false); });

  menu.addEventListener("click", function (ev) {
    var li = ev.target.closest(".opt");
    if (li) choose(li.dataset.id);
  });

  menu.addEventListener("keydown", function (ev) {
    var li = ev.target.closest(".opt");
    if (!li) return;
    if (ev.key === "ArrowDown") { ev.preventDefault(); (li.nextElementSibling || menu.firstElementChild).focus(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); (li.previousElementSibling || menu.lastElementChild).focus(); }
    else if (ev.key === "Home") { ev.preventDefault(); menu.firstElementChild.focus(); }
    else if (ev.key === "End") { ev.preventDefault(); menu.lastElementChild.focus(); }
    else if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); choose(li.dataset.id); }
    else if (ev.key === "Escape") { ev.preventDefault(); closeMenu(true); }
    else if (ev.key === "Tab") { closeMenu(false); }
  });

  btn.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowDown" && menu.hidden) { ev.preventDefault(); openMenu(); }
  });

  document.addEventListener("click", function (ev) {
    if (!menu.hidden && !form.contains(ev.target)) closeMenu(false);
  });

  document.addEventListener("keydown", function (ev) {
    if (capturing || !ev.key || (scrim && !scrim.hidden)) return;
    var sc = shortcut;
    if (ev.key.toLowerCase() !== sc.key.toLowerCase()) return;
    if (ev.ctrlKey !== sc.ctrl || ev.altKey !== sc.alt || ev.metaKey !== sc.meta || ev.shiftKey !== sc.shift) return;
    var t = ev.target;
    var typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
    if (typing && !sc.ctrl && !sc.alt && !sc.meta) return;
    ev.preventDefault();
    q.focus();
  });

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var text = q.value.trim();
    if (!text) { q.focus(); return; }
    openUrl(current.url + encodeURIComponent(text));
  });

  /* 설정: 화면 모드, 검색 결과 열기 방식. 둘 다 이 브라우저에 저장된다. */
  var THEME_KEY = "searchbar.theme";
  var OPEN_KEY = "searchbar.open";
  var settingsEl = document.getElementById("settings");
  var setBtn = document.getElementById("setBtn");
  var setPanel = document.getElementById("setPanel");
  var openMode = "new";

  function readKey(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function writeKey(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); }
  function check(name, value) {
    var el = document.querySelector('input[name="' + name + '"][value="' + value + '"]');
    if (el) el.checked = true;
  }
  function toggleSettings(show) {
    setPanel.hidden = !show;
    setBtn.setAttribute("aria-expanded", show ? "true" : "false");
  }

  var theme = readKey(THEME_KEY);
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  applyTheme(theme);
  check("theme", theme);

  openMode = readKey(OPEN_KEY) === "same" ? "same" : "new";
  check("open", openMode);

  /* 단축키: 검색창으로 이동. 기본값은 "/" */
  var SC_KEY = "searchbar.shortcut";
  var keyBtn = document.getElementById("keyBtn");
  var keyReset = document.getElementById("keyReset");
  var capturing = false;
  var swallowUp = false;
  var shortcut = loadShortcut();

  function defaultShortcut() { return { key: "/", ctrl: false, alt: false, meta: false, shift: false }; }
  function loadShortcut() {
    try {
      var v = JSON.parse(localStorage.getItem(SC_KEY));
      if (v && typeof v.key === "string" && v.key) {
        return { key: v.key, ctrl: !!v.ctrl, alt: !!v.alt, meta: !!v.meta, shift: !!v.shift };
      }
    } catch (e) {}
    return defaultShortcut();
  }
  function shortcutLabel(sc) {
    var mac = /Mac|iPhone|iPad/.test(navigator.platform || "");
    var parts = [];
    if (sc.ctrl) parts.push("Ctrl");
    if (sc.alt) parts.push(mac ? "Option" : "Alt");
    if (sc.shift) parts.push("Shift");
    if (sc.meta) parts.push(mac ? "⌘" : "Win");
    parts.push(sc.key === " " ? "Space" : sc.key.length === 1 ? sc.key.toUpperCase() : sc.key);
    return parts.join(" + ");
  }
  function renderKey() {
    keyBtn.textContent = capturing ? "키를 누르세요" : shortcutLabel(shortcut);
    keyBtn.dataset.capturing = capturing ? "true" : "false";
  }
  function setShortcut(sc) { shortcut = sc; writeKey(SC_KEY, JSON.stringify(sc)); }
  function stopCapture() { capturing = false; renderKey(); }

  var scToggle = document.getElementById("scToggle");
  var scList = document.getElementById("scList");
  scToggle.addEventListener("click", function () {
    scList.hidden = !scList.hidden;
    scToggle.setAttribute("aria-expanded", scList.hidden ? "false" : "true");
  });

  keyBtn.addEventListener("click", function () { capturing = true; renderKey(); });
  keyBtn.addEventListener("blur", stopCapture);
  keyReset.addEventListener("click", function () { setShortcut(defaultShortcut()); stopCapture(); });

  document.addEventListener("keydown", function (ev) {
    if (!capturing) return;
    if (ev.key === "Tab") { stopCapture(); return; }
    ev.preventDefault();
    ev.stopPropagation();
    if (ev.key === "Escape") { stopCapture(); return; }
    if (ev.key === "Shift" || ev.key === "Control" || ev.key === "Alt" || ev.key === "Meta") return;
    setShortcut({ key: ev.key, ctrl: ev.ctrlKey, alt: ev.altKey, meta: ev.metaKey, shift: ev.shiftKey });
    swallowUp = true;
    stopCapture();
  }, true);
  document.addEventListener("keyup", function (ev) {
    if (swallowUp) { ev.preventDefault(); swallowUp = false; }
  }, true);
  renderKey();

  setBtn.addEventListener("click", function () { toggleSettings(setPanel.hidden); });
  document.addEventListener("click", function (ev) {
    if (!setPanel.hidden && !settingsEl.contains(ev.target)) toggleSettings(false);
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !setPanel.hidden) { toggleSettings(false); setBtn.focus(); }
  });

  settingsEl.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.name === "theme") {
      applyTheme(t.value);
      writeKey(THEME_KEY, t.value);
    } else if (t.name === "open") {
      openMode = t.value === "same" ? "same" : "new";
      writeKey(OPEN_KEY, openMode);
    }
  });

  /* 바로가기: 목록은 이 브라우저에 저장된다. 좌클릭은 열기, 우클릭/길게 누르기는 수정 */
  var SHORT_KEY = "searchbar.shortcuts";
  var grid = document.getElementById("shortcuts");
  var scrim = document.getElementById("scrim");
  var dlg = document.getElementById("dlg");
  var dlgTitle = document.getElementById("dlgTitle");
  var scName = document.getElementById("scName");
  var scUrl = document.getElementById("scUrl");
  var scErr = document.getElementById("scErr");
  var scDelete = document.getElementById("scDelete");
  var scCancel = document.getElementById("scCancel");
  var shortcuts = [];
  var editingId = null;
  var lastFocus = null;
  var armed = false;
  var pressTimer = null, pressX = 0, pressY = 0, suppressClick = false, downOnScrim = false;

  var homes = {
    google: "https://www.google.com/", naver: "https://www.naver.com/", daum: "https://www.daum.net/",
    bing: "https://www.bing.com/", ddg: "https://duckduckgo.com/", youtube: "https://www.youtube.com/"
  };

  function openUrl(u) {
    var a = document.createElement("a");
    a.href = u;
    a.target = openMode === "same" ? "_top" : "_blank";
    a.rel = "noopener noreferrer";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function normalizeUrl(input) {
    var s = String(input || "").trim();
    if (!s) return null;
    if (!/^[a-z][a-z0-9+.\-]*:\/\//i.test(s)) s = "https://" + s;
    try {
      var u = new URL(s);
      if (u.protocol !== "http:" && u.protocol !== "https:") return null;
      if (!u.hostname || u.hostname.indexOf(".") === -1) return null;
      return u.href;
    } catch (e) { return null; }
  }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
  function colorFor(host) {
    var h = 0;
    for (var i = 0; i < host.length; i++) h = (h * 31 + host.charCodeAt(i)) % 360;
    return "hsl(" + h + " 42% 38%)";
  }
  function initial(name) { var c = Array.from(String(name).trim())[0]; return c ? c.toUpperCase() : "?"; }

  function defaultShortcuts() {
    return engines.map(function (e) { return { id: e.id, name: e.name, url: homes[e.id], color: e.color }; });
  }
  function loadShortcuts() {
    try {
      var v = JSON.parse(localStorage.getItem(SHORT_KEY));
      if (Array.isArray(v)) {
        var out = [];
        v.forEach(function (s) {
          if (!s || typeof s.id !== "string" || typeof s.name !== "string") return;
          var u = normalizeUrl(s.url);
          if (!u) return;
          var item = { id: s.id, name: s.name, url: u };
          if (typeof s.color === "string" && /^#[0-9a-f]{6}$/i.test(s.color)) item.color = s.color;
          out.push(item);
        });
        return out;
      }
    } catch (e) {}
    return defaultShortcuts();
  }
  function saveShortcuts() { writeKey(SHORT_KEY, JSON.stringify(shortcuts)); }
  function findShortcut(id) {
    for (var i = 0; i < shortcuts.length; i++) if (shortcuts[i].id === id) return shortcuts[i];
    return null;
  }

  function makeIcon(s) {
    var host = hostOf(s.url);
    var ico = document.createElement("div");
    ico.className = "ico";
    ico.style.setProperty("--c", s.color || colorFor(host));
    var letter = document.createElement("span");
    letter.textContent = initial(s.name || host);
    ico.appendChild(letter);
    var img = document.createElement("img");
    img.alt = "";
    img.hidden = true;
    img.draggable = false;
    img.referrerPolicy = "no-referrer";
    var srcs = [
      new URL(s.url).origin + "/favicon.ico",
      "https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(host)
    ];
    var stage = 0;
    img.onload = function () { img.hidden = false; letter.hidden = true; };
    img.onerror = function () { stage++; if (stage < srcs.length) img.src = srcs[stage]; };
    img.src = srcs[0];
    ico.appendChild(img);
    return ico;
  }

  function makeTile(s) {
    var a = document.createElement("a");
    a.className = "tile";
    a.href = s.url;
    a.rel = "noopener noreferrer";
    a.draggable = false;
    a.dataset.id = s.id;
    a.appendChild(makeIcon(s));
    var name = document.createElement("span");
    name.className = "name";
    name.textContent = s.name;
    a.appendChild(name);
    return a;
  }

  function makeAddTile() {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tile add";
    b.id = "addTile";
    b.innerHTML =
      '<span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>' +
      '<span class="name">바로가기 추가</span>';
    return b;
  }

  function renderShortcuts() {
    grid.textContent = "";
    shortcuts.forEach(function (s) { grid.appendChild(makeTile(s)); });
    grid.appendChild(makeAddTile());
  }

  function openEdit(id) {
    var s = id ? findShortcut(id) : null;
    editingId = s ? s.id : null;
    dlgTitle.textContent = s ? "바로가기 편집" : "바로가기 추가";
    scName.value = s ? s.name : "";
    scUrl.value = s ? s.url : "";
    scErr.hidden = true;
    scDelete.hidden = !s;
    armed = false;
    scDelete.textContent = "삭제";
    lastFocus = document.activeElement;
    scrim.hidden = false;
    scName.focus();
  }
  function closeEdit() {
    scrim.hidden = true;
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus();
  }

  grid.addEventListener("click", function (ev) {
    var tile = ev.target.closest(".tile");
    if (!tile) return;
    if (tile.id === "addTile") { openEdit(null); return; }
    ev.preventDefault();
    if (suppressClick) { suppressClick = false; return; }
    var s = findShortcut(tile.dataset.id);
    if (s) openUrl(s.url);
  });
  grid.addEventListener("contextmenu", function (ev) {
    var tile = ev.target.closest(".tile[data-id]");
    if (!tile) return;
    ev.preventDefault();
    if (!scrim.hidden) return;
    openEdit(tile.dataset.id);
  });

  function clearPress() { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } }
  grid.addEventListener("pointerdown", function (ev) {
    suppressClick = false;
    clearPress();
    var tile = ev.target.closest(".tile[data-id]");
    if (!tile) return;
    if (ev.pointerType === "mouse" && ev.button !== 0) return;
    pressX = ev.clientX; pressY = ev.clientY;
    pressTimer = setTimeout(function () {
      pressTimer = null;
      suppressClick = true;
      if (scrim.hidden) openEdit(tile.dataset.id);
    }, 550);
  });
  grid.addEventListener("pointermove", function (ev) {
    if (pressTimer && (Math.abs(ev.clientX - pressX) > 10 || Math.abs(ev.clientY - pressY) > 10)) clearPress();
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (n) { grid.addEventListener(n, clearPress); });

  dlg.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var u = normalizeUrl(scUrl.value);
    if (!u) { scErr.hidden = false; scUrl.focus(); return; }
    var name = scName.value.trim() || hostOf(u);
    var s = editingId ? findShortcut(editingId) : null;
    if (s) {
      s.name = name;
      s.url = u;
    } else {
      shortcuts.push({ id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name, url: u });
    }
    saveShortcuts();
    renderShortcuts();
    closeEdit();
  });
  scCancel.addEventListener("click", closeEdit);
  scDelete.addEventListener("click", function () {
    if (!armed) { armed = true; scDelete.textContent = "한 번 더 누르면 삭제"; return; }
    shortcuts = shortcuts.filter(function (s) { return s.id !== editingId; });
    saveShortcuts();
    renderShortcuts();
    closeEdit();
  });
  scDelete.addEventListener("blur", function () { armed = false; scDelete.textContent = "삭제"; });

  scrim.addEventListener("pointerdown", function (ev) { downOnScrim = ev.target === scrim; });
  scrim.addEventListener("click", function (ev) { if (downOnScrim && ev.target === scrim) closeEdit(); });
  scrim.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); closeEdit(); return; }
    if (ev.key !== "Tab") return;
    var f = Array.prototype.filter.call(dlg.querySelectorAll("input, button"), function (el) { return !el.hidden; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  });

  shortcuts = loadShortcuts();
  renderShortcuts();

  buildMenu();
  var saved = load();
  apply(saved || engines[0]);
})();
</script>

</body></html>
